<!DOCTYPE html>
<html>
<head>
    <title>Cars Dealership</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 50px;
        }

        main {
            padding: 40px 50px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
            max-width: 700px;
        }

        input, textarea, button {
            padding: 12px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>Cars Dealership</h1>
</header>

<main>
    <div class="card">
        <h2>Discover Certified Dealerships</h2>
        <p>Welcome to the Cars Dealership application.</p>

        <h3>Analyze a Review</h3>

        <textarea id="review" rows="4"
            placeholder="Enter your review"></textarea>

        <button onclick="analyzeReview()">Analyze Review</button>

        <div id="result"></div>
    </div>
</main>

<script>
async function analyzeReview() {
    const review = document.getElementById("review").value;

    const response = await fetch("/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({review: review})
    });

    const data = await response.json();

    document.getElementById("result").textContent =
        JSON.stringify(data);
}
</script>

</body>
</html>
