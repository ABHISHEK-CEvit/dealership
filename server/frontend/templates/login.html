<!DOCTYPE html>
<html>
<head>
    <title>Login - Cars Dealership</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #17233c;
        }

        .box {
            width: 400px;
            max-width: calc(100% - 40px);
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,.12);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px;
            border-radius: 5px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Login</h1>

    {% for message in messages %}
        <p class="error">{{ message }}</p>
    {% endfor %}

    <form method="post">
        {% csrf_token %}

        <input
            type="hidden"
            name="next"
            value="{{ request.GET.next }}"
        >

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>
    </form>

    <div class="back">
        <a href="{% url 'home' %}">
            Back to Home
        </a>
    </div>

</div>

</body>
</html>
